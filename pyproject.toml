[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "integration-dashboard"
version = "0.1.0"
description = "Run and dashboard an ecosystem integration-testing matrix."
requires-python = ">=3.11"
dependencies = [
    "jinja2",
    "packaging",
    "pyyaml",
]

[project.scripts]
integration-dashboard = "integration_dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["integration_dashboard*"]

[tool.setuptools.package-data]
integration_dashboard = ["templates/*.html", "templates/*.css"]
